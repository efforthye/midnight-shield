name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test

  # Runs the action from this repo on the example contracts, as a smoke test.
  # examples/vulnerable.compact is meant to produce findings, so it never fails the build.
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          path: examples
          fail-on: none
          upload-sarif: "false"
