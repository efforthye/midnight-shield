name: Release

# Runs when a version tag is pushed. Releasing is two commands:
#   npm version patch      (or minor; updates package.json, src/reporters.ts and
#                           CHANGELOG.md, commits, and tags)
#   git push --follow-tags
# Then this publishes to npm, creates the GitHub release with the changelog
# notes, and publishes to GitHub Packages.
# Uses npm Trusted Publishing (OIDC): no npm token is stored in this repository.
# Set it up once on npmjs.com: package Settings > Trusted Publisher > GitHub Actions,
# repository efforthye/midnight-shield, workflow release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm Trusted Publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5+ is required for Trusted Publishing
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public # provenance is added automatically
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # this version's section of CHANGELOG.md becomes the release notes
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## [" v "]") == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "Install: \`npx midnight-shield .\` · Playground: https://efforthye.github.io/midnight-shield/" >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --latest

  # Also list the package on the repository page. GitHub Packages needs a scoped
  # name, and uses the workflow token. A failure here never blocks the npm release.
  github-packages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@efforthye"
      - run: npm ci
      - name: Publish as @efforthye/midnight-shield
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set name=@efforthye/midnight-shield
          npm pkg delete publishConfig.provenance
          npm publish --ignore-scripts
