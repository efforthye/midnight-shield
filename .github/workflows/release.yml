name: Release

# Publishes to npm when a version tag is pushed:
#   npm version minor   (updates package.json and creates the tag)
#   git push --follow-tags
# Uses npm Trusted Publishing (OIDC): no npm token is stored in this repository.
# Set it up once on npmjs.com: package Settings > Trusted Publisher > GitHub Actions,
# repository efforthye/midnight-shield, workflow release.yml.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm Trusted Publishing and provenance
  packages: write # GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11.5+ is required for Trusted Publishing
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public # provenance is added automatically
      # Also list the package on the repository page (GitHub Packages needs a scoped name).
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> "$NPM_CONFIG_USERCONFIG"
          npm pkg set name=@efforthye/midnight-shield
          npm pkg delete publishConfig.provenance # GitHub Packages has no provenance
          npm publish --registry https://npm.pkg.github.com --provenance=false --ignore-scripts
          git checkout package.json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
