<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Shield Playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%20width%3D%2264%22%20height%3D%2264%22%3E%3Ctitle%3EMidnight%20Shield%3C/title%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22ms-g%22%20x1%3D%220.15%22%20y1%3D%220%22%20x2%3D%220.85%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%238b7cf6%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%234c3bcf%22/%3E%3C/linearGradient%3E%3Cmask%20id%3D%22ms-m%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%23fff%22/%3E%3Ccircle%20cx%3D%2238.5%22%20cy%3D%2225.5%22%20r%3D%2211.5%22%20fill%3D%22%23000%22/%3E%3C/mask%3E%3C/defs%3E%3Cpath%20d%3D%22M32%204.5%20C37.5%207.2%2045.5%209.3%2052.6%2010.2%20C54.8%2010.5%2056%2011.9%2056%2014.1%20V29%20C56%2043.6%2046.4%2054.3%2032%2059.5%20C17.6%2054.3%208%2043.6%208%2029%20V14.1%20C8%2011.9%209.2%2010.5%2011.4%2010.2%20C18.5%209.3%2026.5%207.2%2032%204.5%20Z%22%20fill%3D%22none%22%20stroke%3D%22url%28%23ms-g%29%22%20stroke-width%3D%223.6%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2231%22%20cy%3D%2232%22%20r%3D%2214%22%20fill%3D%22url%28%23ms-g%29%22%20mask%3D%22url%28%23ms-m%29%22/%3E%3Cpath%20d%3D%22M47%2019.5%20l1.1%202.6%202.6%201.1%20-2.6%201.1%20-1.1%202.6%20-1.1%20-2.6%20-2.6%20-1.1%202.6%20-1.1%20Z%22%20fill%3D%22url%28%23ms-g%29%22/%3E%3C/svg%3E">
<meta name="description" content="Paste a Midnight Compact contract and see security and privacy findings. Runs entirely in your browser.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  color-scheme: dark;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2230; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
  --accent: #8b7cf6; --accent2: #b4a9ff; --crit: #d670d6; --high: #f14c4c; --med: #e5c07b; --low: #56b6c2; --info: #8b949e; --ok: #3fb950;
  --line: rgba(139,124,246,.18);
  --scroll: rgba(139,148,158,.28); --scroll-hover: rgba(139,148,158,.5);
}
@media (prefers-color-scheme: light) {
  :root { color-scheme: light; --bg: #f6f8fa; --panel: #ffffff; --panel2: #f3f4f8; --border: #d0d7de; --text: #1f2328; --muted: #59636e;
    --accent: #6d5ce7; --accent2: #5546c9; --crit: #a2269e; --high: #cf222e; --med: #9a6700; --low: #0a7a8a; --info: #59636e; --ok: #1a7f37; --line: rgba(109,92,231,.14); --scroll: rgba(89,99,110,.25); --scroll-hover: rgba(89,99,110,.45); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans); letter-spacing: -0.005em; -webkit-font-smoothing: antialiased; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.brand svg { width: 28px; height: 28px; }
.tag { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
header a { color: var(--accent2); text-decoration: none; font-size: 13px; }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:hover, select:hover { border-color: var(--accent); }
.private { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.private b { color: var(--ok); font-weight: 600; }
body { display: flex; flex-direction: column; }
main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); flex: 1; min-height: 0; }
header, .toolbar, footer { flex: none; }
main > section { min-height: 0; }
@media (max-width: 900px) { body { display: block; height: auto; } main { grid-template-columns: 1fr; } .editor-wrap { height: 65vh; } .private { display: none; } .results { min-height: 50vh; } }
.editor { position: relative; display: flex; flex: 1; min-height: 0; overflow: hidden; }
.gutter { padding: 14px 8px 14px 14px; text-align: right; color: var(--muted); user-select: none; font: 13px/20px var(--mono); white-space: pre; overflow: hidden; min-width: 48px; }
.gutter .hit { color: var(--high); font-weight: 700; }
textarea { flex: 1; resize: none; border: 0; outline: 0; padding: 14px 14px 14px 6px; background: transparent; color: var(--text); font: 13px/20px var(--mono); white-space: pre; overflow: auto; tab-size: 2; }
.results { display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.tab { padding: 10px 12px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.summary { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
.panel { overflow: auto; padding: 0 16px 24px; flex: 1; }
.finding { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--panel); cursor: pointer; transition: border-color .15s, background .15s; }
.finding:hover { border-color: var(--accent); background: var(--panel2); }
.finding .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sev { font-weight: 600; font-size: 11px; letter-spacing: .04em; padding: 1px 7px; border-radius: 4px; background: color-mix(in srgb, currentColor 14%, transparent); }
.rule { font-weight: 600; }
.loc, .conf { color: var(--muted); font-size: 12px; }
.conf::before { content: "·"; margin-right: 8px; }
.msg { margin: 8px 0 8px; color: var(--text); }
.snippet { font: 12px/18px var(--mono); background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; overflow-x: auto; white-space: pre; }
.finding:hover .snippet { background: var(--panel); }
.finding a { display: inline-block; margin-top: 8px; text-decoration: none; }
.finding a:hover { text-decoration: underline; }
.finding a { color: var(--accent2); font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty .big { font-size: 40px; color: var(--ok); }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td code { font: 12px var(--mono); }
.raw { color: var(--high); font-weight: 600; } .hash { color: var(--text); } .commit { color: var(--ok); } .weak { color: var(--med); font-weight: 600; }
.note { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
footer { padding: 8px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
.repo { display: flex; align-items: center; gap: 0; border: 1px solid var(--border); border-radius: 6px; background: var(--panel2); padding-left: 10px; min-width: 300px; flex: 0 1 420px; }
.repo:focus-within { border-color: var(--accent); }
.repo svg { width: 15px; height: 15px; color: var(--muted); flex: none; }
.repo input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 13px; padding: 6px 8px; }
.repo button { border-radius: 0 5px 5px 0; margin: -1px; }
.editor-wrap { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--border); background: var(--panel); }
.filebar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); min-height: 41px; }
.filebar select { max-width: 70%; font-family: var(--mono); font-size: 12px; }
.filelabel { font: 12px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 4px 2px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--border); }
.chip button { border: 0; background: none; padding: 0 6px; color: var(--muted); font-size: 14px; line-height: 1; }
.chip button:hover { color: var(--text); }
.filehead { display: flex; align-items: center; gap: 8px; margin: 18px 0 2px; font: 600 12px var(--mono); color: var(--muted); cursor: pointer; }
.filehead:hover { color: var(--accent2); }
.filehead .count { font-family: var(--sans); font-weight: 500; }
.progress { padding: 40px 16px; text-align: center; color: var(--muted); }
.progress .bar { height: 4px; border-radius: 4px; background: var(--panel2); margin: 14px auto 0; max-width: 280px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.error { color: var(--high); }
/* scrollbars: thin, rounded, theme colored */
* { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--scroll); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--scroll-hover); background-clip: padding-box; }
::-webkit-scrollbar-corner { background: transparent; }
/* code must show exactly what is typed: no ligatures such as >= rendered as a single glyph */
textarea, .gutter, .snippet, code { font-variant-ligatures: none !important; font-feature-settings: "liga" 0, "calt" 0 !important; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="ms-g" x1="0.15" y1="0" x2="0.85" y2="1"><stop offset="0" stop-color="#8b7cf6"/><stop offset="1" stop-color="#4c3bcf"/></linearGradient><mask id="ms-m"><rect width="64" height="64" fill="#fff"/><circle cx="38.5" cy="25.5" r="11.5" fill="#000"/></mask></defs><path d="M32 4.5 C37.5 7.2 45.5 9.3 52.6 10.2 C54.8 10.5 56 11.9 56 14.1 V29 C56 43.6 46.4 54.3 32 59.5 C17.6 54.3 8 43.6 8 29 V14.1 C8 11.9 9.2 10.5 11.4 10.2 C18.5 9.3 26.5 7.2 32 4.5 Z" fill="none" stroke="url(#ms-g)" stroke-width="3.6" stroke-linejoin="round"/><circle cx="31" cy="32" r="14" fill="url(#ms-g)" mask="url(#ms-m)"/><path d="M47 19.5 l1.1 2.6 2.6 1.1 -2.6 1.1 -1.1 2.6 -1.1 -2.6 -2.6 -1.1 2.6 -1.1 Z" fill="url(#ms-g)"/></svg>
    Midnight Shield <span class="tag">Playground · v<span id="version"></span></span>
  </div>
  <div class="spacer"></div>
  <span class="private">🔒 <span>Runs in your browser. <b>Nothing is uploaded.</b></span></span>
  <a href="https://github.com/efforthye/midnight-shield">GitHub</a>
  <a href="https://github.com/efforthye/midnight-shield#rules">Rules</a>
</header>
<div class="toolbar">
  <form class="repo" id="repoForm" autocomplete="off">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.33c-2.23.48-2.7-1.07-2.7-1.07-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.23.83 1.23.83.72 1.22 1.88.87 2.34.66.07-.52.28-.87.5-1.07-1.78-.2-3.65-.89-3.65-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48v2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0Z"/></svg>
    <input id="repoUrl" type="text" spellcheck="false" placeholder="github.com/owner/repo" aria-label="Public GitHub repository">
    <button id="scanRepo" type="submit" class="primary">Scan repo</button>
  </form>
  <button id="openFiles" type="button">Open files</button>
  <button id="openFolder" type="button">Open folder</button>
  <input id="fileInput" type="file" multiple accept=".compact,.ts,.tsx,.mts,.cts,.js,.jsx,.mjs,.cjs" hidden>
  <input id="folderInput" type="file" webkitdirectory multiple hidden>
  <select id="example" aria-label="Load an example">
    <option value="">Examples…</option>
  </select>
  <div class="spacer"></div>
  <select id="minSeverity" aria-label="Minimum severity">
    <option value="info">All severities</option>
    <option value="low">Low and above</option>
    <option value="medium">Medium and above</option>
    <option value="high">High and above</option>
  </select>
  <button id="share" type="button">Copy share link</button>
  <button id="download" type="button">Download report</button>
</div>
<main>
  <section class="editor-wrap">
    <div class="filebar">
      <select id="fileSelect" aria-label="File" hidden></select>
      <span id="fileLabel" class="filelabel"></span>
      <div class="spacer"></div>
      <select id="lang" aria-label="Language">
        <option value="compact">Compact</option>
        <option value="ts">TypeScript</option>
      </select>
    </div>
    <div class="editor">
      <div class="gutter" id="gutter" aria-hidden="true"></div>
      <textarea id="code" spellcheck="false" aria-label="Source code"></textarea>
    </div>
  </section>
  <section class="results">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="findings" role="tab">Findings</button>
      <button class="tab" data-tab="disclosures" role="tab">Disclosure map</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="panel" id="panel"></div>
  </section>
</main>
<footer>Community project for the Midnight ecosystem. Not an official Midnight Foundation product. A clean scan is not an audit.</footer>
<script>/*__BUNDLE__*/</script>
</body>
</html>
