<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Shield Playground</title>
<meta name="description" content="Paste a Midnight Compact contract and see security and privacy findings. Runs entirely in your browser.">
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel2: #1c2230; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
  --accent: #8b7cf6; --accent2: #b4a9ff; --crit: #d670d6; --high: #f14c4c; --med: #e5c07b; --low: #56b6c2; --info: #8b949e; --ok: #3fb950;
  --line: rgba(139,124,246,.18);
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f6f8fa; --panel: #ffffff; --panel2: #f3f4f8; --border: #d0d7de; --text: #1f2328; --muted: #59636e;
    --accent: #6d5ce7; --accent2: #5546c9; --crit: #a2269e; --high: #cf222e; --med: #9a6700; --low: #0a7a8a; --info: #59636e; --ok: #1a7f37; --line: rgba(109,92,231,.14); }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--panel); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
.brand svg { width: 26px; height: 26px; }
.tag { font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
header a { color: var(--accent2); text-decoration: none; font-size: 13px; }
.toolbar { display: flex; gap: 8px; align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
select, button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:hover, select:hover { border-color: var(--accent); }
.private { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.private b { color: var(--ok); font-weight: 600; }
main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); height: calc(100% - 112px); min-height: 520px; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; height: auto; } .editor { height: 60vh; } .results { min-height: 50vh; } }
.editor { position: relative; display: flex; border-right: 1px solid var(--border); background: var(--panel); overflow: hidden; }
.gutter { padding: 14px 8px 14px 14px; text-align: right; color: var(--muted); user-select: none; font: 13px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; overflow: hidden; min-width: 48px; }
.gutter .hit { color: var(--high); font-weight: 700; }
textarea { flex: 1; resize: none; border: 0; outline: 0; padding: 14px 14px 14px 6px; background: transparent; color: var(--text); font: 13px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; overflow: auto; tab-size: 2; }
.results { display: flex; flex-direction: column; min-width: 0; }
.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.tab { padding: 10px 12px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.summary { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); }
.panel { overflow: auto; padding: 0 16px 24px; flex: 1; }
.finding { border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--panel); cursor: pointer; }
.finding:hover { border-color: var(--accent); }
.finding .head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.sev { font-weight: 700; font-size: 12px; letter-spacing: .04em; }
.rule { font-weight: 600; }
.loc, .conf { color: var(--muted); font-size: 12px; }
.msg { margin: 6px 0 4px; }
.snippet { font: 12px/18px ui-monospace, Menlo, Consolas, monospace; background: var(--panel2); border-radius: 6px; padding: 6px 8px; overflow-x: auto; white-space: pre; }
.finding a { color: var(--accent2); font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty .big { font-size: 40px; color: var(--ok); }
table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td code { font: 12px ui-monospace, Menlo, Consolas, monospace; }
.raw { color: var(--high); font-weight: 600; } .hash { color: var(--text); } .commit { color: var(--ok); } .weak { color: var(--med); font-weight: 600; }
.note { color: var(--muted); font-size: 12px; margin: 12px 0 0; }
footer { padding: 8px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="var(--accent)"/><path d="m8.5 12 2.5 2.5 4.5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Midnight Shield <span class="tag">Playground · v<span id="version"></span></span>
  </div>
  <div class="spacer"></div>
  <a href="https://github.com/efforthye/midnight-shield">GitHub</a>
  <a href="https://github.com/efforthye/midnight-shield#rules">Rules</a>
</header>
<div class="toolbar">
  <select id="example" aria-label="Load an example">
    <option value="">Load an example…</option>
  </select>
  <select id="lang" aria-label="Language">
    <option value="compact">Compact (.compact)</option>
    <option value="ts">TypeScript (.ts)</option>
  </select>
  <select id="minSeverity" aria-label="Minimum severity">
    <option value="info">All severities</option>
    <option value="low">Low and above</option>
    <option value="medium">Medium and above</option>
    <option value="high">High and above</option>
  </select>
  <button id="share">Copy share link</button>
  <button id="download" class="primary">Download report</button>
  <span class="private">🔒 <span>Runs in your browser. <b>Your code never leaves this page.</b></span></span>
</div>
<main>
  <section class="editor">
    <div class="gutter" id="gutter" aria-hidden="true"></div>
    <textarea id="code" spellcheck="false" aria-label="Contract source"></textarea>
  </section>
  <section class="results">
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="findings" role="tab">Findings</button>
      <button class="tab" data-tab="disclosures" role="tab">Disclosure map</button>
    </div>
    <div class="summary" id="summary"></div>
    <div class="panel" id="panel"></div>
  </section>
</main>
<footer>Community project for the Midnight ecosystem. Not an official Midnight Foundation product. A clean scan is not an audit.</footer>
<script>/*__BUNDLE__*/</script>
</body>
</html>
